# Server Configuration
server.port=8080
server.servlet.context-path=/lankajobshub

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/LankaJobsHub.com?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Schema Generation
# Use update for real-time schema changes in local dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Schema Initialization (disabled to avoid conflicts with JPA update in local dev)
spring.sql.init.mode=never

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# File Upload Configuration
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true

# File Storage Configuration (Local Storage)
app.file.upload-dir=./uploads/
app.file.max-size=2097152

# JWT Configuration
app.jwt.secret=${JWT_SECRET:change-this-secret-before-production}
app.jwt.expiration=86400000

# Logging Configuration
logging.level.com.lankajobshub=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Development Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
